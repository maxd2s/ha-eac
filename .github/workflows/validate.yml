name: validate

on:
  push:
    branches: [main, harden-modernize-eac]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-test.txt
      - run: node --test tests/test_*.cjs
      - run: python scripts/run_tests.py -q --tb=short
      - run: python -m pip install homeassistant==2026.11.1
      - run: python scripts/smoke_ha.py
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install bandit==1.9.4 pip-audit==2.10.1 ruff==0.17.4
      - run: ruff check custom_components tests --select E9,F,I
      - run: ruff format --check custom_components tests
      - run: bandit -r custom_components
      - run: pip-audit -r audit/runtime-resolved.txt --no-deps --disable-pip
      - name: Audit fresh runtime dependency resolution
        run: |
          python -c 'import json; print("\n".join(json.load(open("custom_components/eac_cyprus/manifest.json"))["requirements"]))' > "$RUNNER_TEMP/eac-runtime.txt"
          pip-audit -r "$RUNNER_TEMP/eac-runtime.txt"
      - run: bash -n scripts/deploy_smb.sh
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
